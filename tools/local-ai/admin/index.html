<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Overleaf AI 设置</title><style>
:root{font-family:system-ui,sans-serif;color:#18252c;background:#f2f6f4}body{max-width:780px;margin:56px auto;padding:0 20px}h1{font-size:30px;margin:8px 0}p{line-height:1.6;color:#52645d}.tag{color:#187253;font-weight:700}.card{background:white;border:1px solid #d8e6de;border-radius:16px;padding:26px;margin:20px 0;box-shadow:0 8px 24px #244d3510}label{font-weight:650;display:block;margin:18px 0 8px}input,select{box-sizing:border-box;width:100%;padding:12px;border:1px solid #bdcec3;border-radius:8px;font-size:15px;background:white}button{border:0;border-radius:8px;padding:11px 16px;font-size:14px;cursor:pointer;background:#1c7652;color:white;margin:12px 8px 0 0}.secondary{color:#245944;background:#e8f4ed}.note{font-size:14px;color:#596a61}.status{min-height:24px;color:#195f45}.badge{background:#fff4d5;border:1px solid #ebd596;border-radius:10px;padding:12px;color:#6b5111}
</style></head><body><div class="tag">OVERLEAF · 本机管理</div><h1>AI 写作助手设置</h1><p>在这里配置共享的模型服务。密钥保存在本机，填写后不会再次显示。</p><div class="badge">保存设置后需重新启动 Overleaf 服务，新的模型配置才会生效。</div><div class="card"><h2>OpenAI</h2><p class="note" id="key-status">正在读取配置…</p><label for="key">API 密钥</label><input id="key" type="password" autocomplete="off" placeholder="输入新密钥；留空保留原密钥"><button class="secondary" id="models">获取可用模型</button><label for="model">文字模型</label><select id="model" disabled><option value="">请先填写密钥，系统将自动获取模型</option></select><label for="effort">思考额度</label><select id="effort" disabled><option value="">请先选择文字模型</option></select><label for="voice">语音识别模型（预留）</label><select id="voice" disabled><option value="">不选择</option></select><p class="note">只显示此账户可用的 Terra、Astra、Sol 和语音识别模型。语音识别功能尚未接入。</p><button id="save">保存设置</button><p id="status" class="status" role="status"></p></div><div class="card"><h2>文献搜索</h2><p id="alpha-status">正在读取配置…</p></div><script>
const token='__CSRF__', $=x=>document.getElementById(x), status=(s)=>$('status').textContent=s;
async function post(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Local-CSRF':token},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d}
let savedModel='', savedVoice='', savedEffort='medium', savedKey=false, timer, requestId=0;
const levels={ 'gpt-6.1-terra':['none','low','medium','high','xhigh','max'], 'gpt-6-astra':['low','medium','high','xhigh','max'], 'gpt-6.1-sol':['low','medium','high','xhigh','max'], 'gpt-6-sol':['none','low','medium','high','xhigh','max'] };
function updateEffort(preferred){const allowed=levels[$('model').value]||[];const old=preferred||$('effort').value||'medium';$('effort').replaceChildren(...allowed.map(m=>new Option(m,m)));$('effort').disabled=!allowed.length;if(allowed.includes(old))$('effort').value=old;else if(allowed.includes('medium'))$('effort').value='medium'}
$('model').onchange=()=>updateEffort();
async function loadModels(){const request=++requestId;const key=$('key').value.trim();if(!key&&!savedKey){$('model').disabled=true;status('请先填写密钥。');return} $('model').disabled=true;$('voice').disabled=true;status('正在从 OpenAI 获取模型…');try{const d=await post('/api/models',{key});if(request!==requestId)return;const oldModel=$('model').value||savedModel, oldVoice=$('voice').value||savedVoice;const texts=d.models.text, voices=d.models.voice;$('model').replaceChildren(new Option(texts.length?'请选择文字模型':'账户暂无目标文字模型',''),...texts.map(m=>new Option(m,m)));if(texts.includes(oldModel))$('model').value=oldModel;$('model').disabled=!texts.length;updateEffort(savedEffort);$('voice').replaceChildren(new Option('暂不选择',''),...voices.map(m=>new Option(m,m)));if(voices.includes(oldVoice))$('voice').value=oldVoice;$('voice').disabled=!voices.length;status(texts.length?`已获取 ${texts.length} 个文字模型、${voices.length} 个语音识别模型。`:'没有找到目标文字模型，请检查账户权限。')}catch(e){if(request!==requestId)return;$('model').replaceChildren(new Option('获取失败，请检查密钥和网络',''));status(e.message)}}
fetch('/api/status').then(r=>r.json()).then(d=>{savedModel=d.model||'';savedVoice=d.transcription_model||'';savedEffort=d.reasoning_effort||'medium';savedKey=!!d.key_configured;$('alpha-status').textContent=d.alphaxiv_enabled?'AlphaXiv 已配置；AI 版本启用后可在侧边栏搜索文献。':'AlphaXiv 尚未配置。';$('key-status').textContent=savedKey?'密钥已配置；留空会保留原密钥。':'尚未配置密钥。';if(savedKey)loadModels()}).catch(()=>status('无法读取配置'));
$('key').addEventListener('input',()=>{clearTimeout(timer);++requestId;$('model').disabled=true;$('effort').disabled=true;timer=setTimeout(loadModels,900)});
$('save').onclick=async()=>{if(!$('model').value){status('请先从列表中选择文字模型。');return}try{await post('/api/save',{key:$('key').value,model:$('model').value,reasoning_effort:$('effort').value,transcription_model:$('voice').value});savedModel=$('model').value;savedVoice=$('voice').value;savedEffort=$('effort').value;savedKey=true;$('key').value='';$('key-status').textContent='设置已保存。';status('已保存。重新启动 Overleaf 服务后，新设置生效。')}catch(e){status(e.message)}};
$('models').onclick=loadModels;
</script></body></html>
